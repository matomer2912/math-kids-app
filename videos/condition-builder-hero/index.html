<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "IBM Plex Sans"; font-weight: 400; src: url("fonts/plex-sans-400.ttf"); }
      @font-face { font-family: "IBM Plex Sans"; font-weight: 500; src: url("fonts/plex-sans-500.ttf"); }
      @font-face { font-family: "IBM Plex Sans"; font-weight: 600; src: url("fonts/plex-sans-600.ttf"); }

      :root {
        --ink: #121619;
        --ink-2: #343a3f;
        --muted: #5f666d;
        --teal: #00786f;
        --amber: #ffb000;
        --sans: "IBM Plex Sans", system-ui, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #eef2f6; }

      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: var(--sans); color: var(--ink);
        background:
          radial-gradient(1200px 800px at 18% 12%, #ffffff 0%, rgba(255,255,255,0) 60%),
          linear-gradient(170deg, #f7f9fc 0%, #e9eff4 55%, #e3eaf0 100%);
      }

      /* ---- light ---- */
      .lt { position: absolute; pointer-events: none; }
      #bounce-teal { width: 900px; height: 900px; left: -360px; bottom: -420px; border-radius: 50%; background: #bfe3de; filter: blur(140px); opacity: 0.75; }
      #rim-amber { width: 800px; height: 800px; right: -300px; top: -260px; border-radius: 50%; background: #ffd98a; filter: blur(150px); opacity: 0.6; }
      #beam { width: 760px; height: 1700px; left: 80px; top: -300px; transform: rotate(24deg); background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.75) 50%, rgba(255,255,255,0) 100%); filter: blur(46px); opacity: 0.7; }
      #vignette { inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(40,62,84,0.16) 100%); z-index: 9; }

      /* ---- world (camera moves this) ---- */
      #world { position: absolute; inset: 0; }

      /* soft blurred background rows (depth) */
      .bg { position: absolute; display: flex; gap: 4px; filter: blur(14px); opacity: 0.55; }
      .bg .cell { height: 84px; font-size: 30px; opacity: 1; }

      #rule { position: absolute; left: 0; top: 410px; width: 1920px; display: flex; justify-content: center; }
      #rulein { display: flex; flex-direction: column; gap: 34px; }
      .row { position: relative; display: flex; gap: 6px; align-items: stretch; width: fit-content; }

      .cell { height: 100px; display: flex; align-items: center; gap: 14px; padding: 0 28px; font-size: 34px; white-space: nowrap; }
      .kw { width: 130px; justify-content: center; padding: 0; color: var(--muted); font-size: 30px; font-weight: 500; }
      .chip {
        position: relative; background: #fff; border-radius: 12px;
        box-shadow: 0 26px 50px -14px rgba(28, 52, 76, 0.22), 0 6px 14px rgba(28, 52, 76, 0.08), inset 0 1px 0 #fff;
      }
      .chip .f { font-weight: 600; }
      .chip .o { color: var(--muted); font-size: 30px; }
      .chip svg { width: 36px; height: 36px; fill: none; stroke: var(--ink); stroke-width: 1.2; flex: none; }
      .chip svg.x { width: 28px; height: 28px; margin-left: 10px; stroke: var(--muted); stroke-width: 1.5; }
      .rim { position: absolute; inset: -3px; border-radius: 15px; border: 2px solid var(--amber); box-shadow: 0 0 40px rgba(255, 176, 0, 0.45); opacity: 0; pointer-events: none; }

      .chipwrap { position: relative; display: flex; }
      .slot { position: absolute; inset: 0; border: 2px dashed #9aa5af; border-radius: 12px; display: flex; align-items: center; padding-left: 28px; }
      .caret { width: 3px; height: 44px; background: var(--teal); border-radius: 2px; }

      .thread { position: absolute; height: 4px; background: var(--teal); border-radius: 2px; bottom: -15px; left: 0; right: 0; transform-origin: 0 50%; opacity: 0.85; }

      #sweep { width: 520px; height: 1500px; left: -700px; top: -200px; transform: rotate(22deg); background: linear-gradient(90deg, rgba(255,176,0,0) 0%, rgba(255,190,60,0.32) 50%, rgba(255,176,0,0) 100%); filter: blur(34px); opacity: 0; z-index: 8; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="1920" data-height="1080">
      <div id="bounce-teal" class="lt" data-layout-allow-overflow></div>
      <div id="rim-amber" class="lt" data-layout-allow-overflow></div>
      <div id="beam" class="lt" data-layout-allow-overflow></div>

      <div id="world">
        <!-- out-of-focus rows far behind: depth, not content -->
        <div id="bgrows" aria-hidden="true" data-layout-ignore>
          <div class="bg" style="left:120px; top:150px"><div class="cell chip">Region is North America</div></div>
          <div class="bg" style="left:1180px; top:120px; transform:scale(1.15)"><div class="cell chip">Notify underwriter</div></div>
          <div class="bg" style="left:1300px; top:800px; transform:scale(1.3)"><div class="cell chip">Channel is Web</div></div>
          <div class="bg" style="left:90px; top:820px; transform:scale(1.1)"><div class="cell chip">Currency is USD</div></div>
        </div>

        <div id="rule">
          <div id="rulein"><div class="row" id="row1">
            <div class="cell kw" id="k-if">if</div>
            <div class="chipwrap">
              <div class="slot" id="slot"><div class="caret" id="caret"></div></div>
              <div class="cell chip" id="c1">
                <svg viewBox="0 0 16 16"><path d="M2.5 2.5h5l6 6-5 5-6-6z"/><circle cx="5.5" cy="5.5" r="1"/></svg>
                <span class="f">Product</span><span class="o">is</span><span>Life insurance</span>
                <svg class="x" viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
                <i class="rim"></i>
              </div>
            </div>
            <div class="cell kw" id="k-and" style="width:120px">and</div>
            <div class="cell chip" id="c2">
              <svg viewBox="0 0 16 16"><circle cx="8" cy="5.5" r="2.5"/><path d="M3 13.5c.6-2.6 2.6-4 5-4s4.4 1.4 5 4"/></svg>
              <span class="f">Age</span><span class="o">is below</span><span>25</span>
              <svg class="x" viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
              <i class="rim"></i>
            </div>
            <div class="thread" id="th1"></div>
          </div>
          <div class="row" id="row2">
            <div class="cell kw" id="k-then">then</div>
            <div class="cell chip" id="c3">
              <span class="f">Apply 10% discount</span>
              <svg class="x" viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
              <i class="rim"></i>
            </div>
            <div class="thread" id="th2"></div>
          </div>
          </div>
        </div>
      </div>

      <div id="sweep" class="lt" data-layout-allow-overflow></div>
      <div id="vignette" class="lt"></div>
    </div>

    <script>
      window.__hfBuild = function () {
      const tl = gsap.timeline({ paused: true });
      const P = { transformPerspective: 1800 };

      // ---- measure the laid-out rule once, in unscaled space, so the camera aims at real positions ----
      const ctr = (sel) => { const r = document.querySelector(sel).getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };
      const slotC = ctr("#slot"), c1C = ctr("#c1"), c2C = ctr("#c2");
      const rb = document.querySelector("#rulein").getBoundingClientRect();
      const rule = { x: rb.left + rb.width / 2, y: rb.top + rb.height / 2 };
      const mid = { x: (c1C.x + c2C.x) / 2, y: (c1C.y + c2C.y) / 2 };
      const O = rule;
      gsap.set("#world", { transformOrigin: O.x + "px " + O.y + "px" });
      // camera pose that puts focus point F at screen centre at scale s
      const cam = (F, s, ry, rx) => ({ scale: s, x: 960 - O.x - s * (F.x - O.x), y: 540 - O.y - s * (F.y - O.y), rotationY: ry, rotationX: rx });

      // ---- opening state (identical at 0s and 9s: the loop seam) ----
      const open = cam(slotC, 1.8, -9, 3);
      gsap.set("#world", { ...open, ...P });
      gsap.set(["#c1", "#c2", "#c3", "#k-and", "#k-then"], { opacity: 0 });
      gsap.set(["#th1", "#th2"], { scaleX: 0 });

      // ---------- CAMERA: one continuous dolly — tight on the slot, follows the build, settles wide, returns ----------
      tl.to("#world", { ...cam(mid, 1.4, -5, 2), duration: 3.0, ease: "sine.inOut" }, 0);
      tl.to("#world", { ...cam(rule, 1.12, -1.5, 0.6), duration: 2.6, ease: "sine.inOut" }, 3.0);
      tl.to("#world", { ...cam(rule, 1.07, 0, 0), duration: 1.8, ease: "sine.out" }, 5.6);
      tl.to("#world", { ...open, duration: 1.6, ease: "sine.inOut" }, 7.4);

      // ---------- LIGHT: slow beam drift, returns to start ----------
      tl.to("#beam", { x: 160, opacity: 0.9, duration: 4.5, ease: "sine.inOut" }, 0);
      tl.to("#beam", { x: 0, opacity: 0.7, duration: 4.5, ease: "sine.inOut" }, 4.5);

      // depth: background rows drift against the camera and rack focus with it
      tl.to("#bgrows", { x: -50, duration: 4.5, ease: "sine.inOut" }, 0);
      tl.to("#bgrows", { x: 0, duration: 4.5, ease: "sine.inOut" }, 4.5);
      tl.to(".bg", { filter: "blur(7px)", duration: 3.5, ease: "sine.inOut" }, 2.8);
      tl.to(".bg", { filter: "blur(14px)", duration: 2.2, ease: "sine.inOut" }, 6.6);

      // ---------- ACT 1: the empty slot waits (caret blinks), then the first condition resolves ----------
      tl.set("#caret", { opacity: 0 }, 0.45);
      tl.set("#caret", { opacity: 1 }, 0.9);
      tl.fromTo("#c1", { opacity: 0, x: 70, filter: "blur(18px)", scale: 0.96 },
        { opacity: 1, x: 0, filter: "blur(0px)", scale: 1, duration: 1.7, ease: "power3.out" }, 1.0);
      tl.to("#slot", { opacity: 0, duration: 1.0, ease: "sine.inOut" }, 1.5);

      // ---------- ACT 2: "and" + second condition, then the action ----------
      tl.to("#k-and", { opacity: 1, duration: 0.9, ease: "power2.out" }, 2.5);
      tl.fromTo("#c2", { opacity: 0, x: 70, filter: "blur(18px)", scale: 0.96 },
        { opacity: 1, x: 0, filter: "blur(0px)", scale: 1, duration: 1.7, ease: "power3.out" }, 2.8);
      tl.to("#k-then", { opacity: 1, duration: 0.9, ease: "power2.out" }, 4.0);
      tl.fromTo("#c3", { opacity: 0, x: 70, filter: "blur(18px)", scale: 0.96 },
        { opacity: 1, x: 0, filter: "blur(0px)", scale: 1, duration: 1.7, ease: "power3.out" }, 4.3);

      // the logic thread pulls taut: across the conditions, down the spine, along the action
      tl.to("#th1", { scaleX: 1, duration: 1.5, ease: "power2.inOut" }, 5.0);
      tl.to("#th2", { scaleX: 1, duration: 1.2, ease: "power2.inOut" }, 6.0);

      // ---------- ACT 3: warm amber light crosses the finished rule ----------
      tl.to("#sweep", { x: 3100, duration: 2.4, ease: "sine.inOut" }, 5.7);
      tl.to("#sweep", { opacity: 1, duration: 0.8, ease: "sine.out" }, 5.7);
      tl.to("#sweep", { opacity: 0, duration: 0.8, ease: "sine.in" }, 7.3);
      tl.to("#c1 .rim", { opacity: 1, duration: 0.7, ease: "sine.out" }, 6.3);
      tl.to("#c2 .rim", { opacity: 1, duration: 0.7, ease: "sine.out" }, 6.7);
      tl.to("#c3 .rim", { opacity: 1, duration: 0.7, ease: "sine.out" }, 7.1);
      tl.to(".rim", { opacity: 0, duration: 0.9, ease: "sine.inOut" }, 7.9);

      // ---------- RESET: dissolve back to the empty slot (frame at 9s == frame at 0s) ----------
      tl.to("#c3", { opacity: 0, x: -50, filter: "blur(16px)", duration: 1.0, ease: "sine.in" }, 7.4);
      tl.to("#c2", { opacity: 0, x: -50, filter: "blur(16px)", duration: 1.0, ease: "sine.in" }, 7.6);
      tl.to("#c1", { opacity: 0, x: -50, filter: "blur(16px)", duration: 1.0, ease: "sine.in" }, 7.8);
      tl.to(["#k-and", "#k-then"], { opacity: 0, duration: 0.8, ease: "sine.in" }, 7.5);
      tl.to(["#th1", "#th2"], { opacity: 0, duration: 0.7, ease: "sine.in" }, 7.4);
      tl.set(["#th1", "#th2"], { scaleX: 0, opacity: 0.85 }, 8.3);
      tl.to("#slot", { opacity: 1, duration: 0.7, ease: "sine.out" }, 8.3);
      tl.set("#caret", { opacity: 0 }, 8.45);
      tl.set("#caret", { opacity: 1 }, 8.9);

      window.__timelines["main"] = tl;
      tl.seek(0);
      if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      };
      document.fonts.ready.then(window.__hfBuild);
    </script>
  </body>
</html>
